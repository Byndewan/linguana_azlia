<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Module - Tailadmin Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F1F5F9] text-slate-800 p-8"> <!-- bg-slate-100 mirip Tailadmin -->

    <!-- ================= BREADCRUMB & HEADER ================= -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold text-slate-800">
            Everyday Conversations
        </h2>

        <nav>
            <ol class="flex items-center gap-2 text-sm">
                <li><a class="font-medium text-slate-500 hover:text-blue-600 transition-colors" href="#">Modules</a></li>
                <li class="font-medium text-slate-500">/</li>
                <li class="font-medium text-blue-600">Manage</li>
            </ol>
        </nav>
    </div>

    <!-- ================= MAIN CARD CONTAINER ================= -->
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm max-w-5xl mx-auto">
        
        <!-- HEADER CARD: TAB NAVIGATION -->
        <div class="border-b border-slate-200 px-6 pt-4 flex gap-8 overflow-x-auto">
            <!-- Tab 1: Active -->
            <button class="pb-4 border-b-2 border-blue-600 text-blue-600 font-bold flex items-center gap-2 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" /></svg>
                Sub Modules
            </button>
            
            <!-- Tab 2: Inactive -->
            <button class="pb-4 border-b-2 border-transparent text-slate-400 hover:text-slate-600 font-bold flex items-center gap-2 shrink-0 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" /></svg>
                Vocabulary
            </button>
            
            <!-- Tab 3: Inactive -->
            <button class="pb-4 border-b-2 border-transparent text-slate-400 hover:text-slate-600 font-bold flex items-center gap-2 shrink-0 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" /></svg>
                Final Quiz
            </button>
        </div>

        <!-- BODY CARD: CONTENT AREA -->
        <div class="p-6">
            
            <!-- Action Bar -->
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-800">Curriculum Structure</h3>
                <!-- Tombol Add warna biru Tailadmin -->
                <button class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2 text-sm shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    Add Sub Module
                </button>
            </div>

            <!-- LIST SUB MODULE (Accordion) -->
            <div class="flex flex-col gap-4">
                
                <!-- ACCORDION 1: Active/Open State -->
                <div class="bg-white border-2 border-blue-100 rounded-xl shadow-sm overflow-hidden transition-all">
                    
                    <!-- Accordion Header -->
                    <div class="px-6 py-4 flex items-center justify-between bg-blue-50/50">
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                1
                            </div>
                            <h4 class="font-bold text-slate-800 text-lg">Greetings & Introductions</h4>
                        </div>
                        <div class="flex items-center gap-3">
                            <button class="p-1.5 text-slate-400 hover:text-blue-600 bg-white rounded-md shadow-sm transition-colors border border-slate-100" title="Edit">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                            </button>
                            <button class="p-1.5 text-slate-400 hover:text-red-500 bg-white rounded-md shadow-sm transition-colors border border-slate-100" title="Delete">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                            </button>
                            <!-- Icon Panah Up -->
                            <svg class="w-5 h-5 text-blue-600 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" /></svg>
                        </div>
                    </div>
                    
                    <!-- Accordion Body (Daftar Kuis) -->
                    <div class="px-6 pb-6 pt-2 border-t border-blue-100">
                        <div class="flex flex-col gap-3 mt-4">
                            
                            <!-- List Item: Flashcard -->
                            <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-slate-200 hover:border-blue-300 shadow-sm transition-colors">
                                <div class="flex items-center gap-4">
                                    <div class="p-2.5 bg-amber-100 text-amber-600 rounded-lg">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 00-5.78 1.128 2.25 2.25 0 01-2.4 2.245 4.5 4.5 0 008.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 003.388-1.62m-5.043-.025a15.994 15.994 0 011.622-3.395m3.42 3.42a15.995 15.995 0 004.764-4.648l3.876-5.814a1.151 1.151 0 00-1.597-1.597L14.146 6.32a15.996 15.996 0 00-4.649 4.763m3.42 3.42a6.776 6.776 0 00-3.42-3.42" /></svg>
                                    </div>
                                    <div>
                                        <h5 class="font-bold text-slate-800 text-sm">Basic Greetings</h5>
                                        <p class="text-xs text-slate-400 font-medium mt-0.5">Flashcard • 12 Items</p>
                                    </div>
                                </div>
                                <!-- Tombol Manage spesifik per kuis -->
                                <a href="#" class="text-xs font-bold px-4 py-2 text-amber-700 bg-amber-50 hover:bg-amber-100 rounded-lg transition-colors border border-amber-100">Manage</a>
                            </div>
                            
                            <!-- Add Quiz Button -->
                            <button class="mt-2 w-full py-3 border-2 border-dashed border-slate-200 text-slate-400 font-bold rounded-xl hover:border-blue-600 hover:text-blue-600 hover:bg-blue-50 transition-colors text-sm flex justify-center items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                                Add Quiz / Material
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ACCORDION 2: Inactive/Closed State -->
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm hover:border-slate-300 transition-colors">
                    <div class="px-6 py-4 flex items-center justify-between cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 rounded-full border-2 border-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm">2</div>
                            <h4 class="font-bold text-slate-700 text-lg">Formal vs Informal Speech</h4>
                        </div>
                        <div class="flex items-center gap-3">
                            <button class="p-1.5 text-slate-400 hover:text-blue-600 transition-colors" title="Edit">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                            </button>
                            <button class="p-1.5 text-slate-400 hover:text-red-500 transition-colors" title="Delete">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                            </button>
                            <!-- Icon Panah Down -->
                            <svg class="w-5 h-5 text-slate-400 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
